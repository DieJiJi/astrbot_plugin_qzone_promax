name: astrbot_plugin_qzone_promax
display_name: QQ动态ProMax
desc: >-
  在原版 QQ空间插件（GPL-3.0，作者 Zhalslar）核心层之上重做，把「评论」和「发动态」合并成一个插件。
  评论侧：指定内容原样评论、带上下文的智能评论、楼中楼自主回复；
  发动态侧：手动发说说、可配置的定时自动发布（默认关闭）；
  并内置每日额度、冷却时间、单轮人数、每人条数、单主楼上限、对话轮次等多级限流，防止 LLM 超支。
help: |
  【发动态】
  发说说 今天天气不错 —— 按主题生成并发一条动态
  发说说 —— 不带主题则由她自己挑话题
  发原话 我想说的话 —— 按你的原话原封不动发
  删说说 [序号] —— 删掉自己第 N 条说说，默认最新一条

  【评论】
  评论说说 <序号> <内容> —— 按你的原话评论动态流第 N 条
  智能评论 <序号> —— 结合正文/图片/已有评论生成一句人话

  【楼中楼】
  楼中楼 —— 立刻巡检一次并自动回复
  楼中楼状态 —— 查看今日额度、冷却与策略

  【其他】
  动态配置 —— 查看发动态与楼中楼的当前设置
  以上命令均需管理员权限。

  省钱旋钮都在插件配置里，分三组：
  增强功能配置（pro）   —— 楼中楼：策略、巡检间隔、冷却、单轮人数、
                            每人每日条数、单主楼上限、同一条评论接几轮、字数
  发动态配置（publish） —— 是否定时、每天几条、哪些时间点、抖动、
                            每日上限、两条间隔、素材来源、风格、字数
  触发配置（trigger）   —— 定时评论/发布的 cron、聊天触发概率、是否自动点赞
version: v1.0.0
author: Zhalslar (原作者) / 小鱼儿
repo: https://github.com/DieJiJi/astrbot_plugin_qzone_promax
